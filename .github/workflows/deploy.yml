name: Deploy documentation Worker
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notify_only:
        description: Retry the saved IndexNow queue without deploying
        type: boolean
        default: false
concurrency:
  group: tamperbox-doc-production-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      TAMPERBOX_RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore IndexNow queue and content baseline
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .indexnow
          key: production-indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: production-indexnow-v1-
      - name: Validate release
        if: ${{ !inputs.notify_only }}
        run: npm test && npm run check
      - name: Deploy production and process IndexNow queue
        if: ${{ !inputs.notify_only }}
        run: npm run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Retry IndexNow without deploying
        if: inputs.notify_only
        run: npm run indexnow:retry
      - name: Save remaining queue, including after failures
        if: ${{ always() && hashFiles('.indexnow/state.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .indexnow
          key: production-indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
